services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pig_market
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: npm run dev
    working_dir: /app
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pig_market"
      JWT_SECRET: supersecret123
      PORT: 5000
    ports:
      - "5001:5000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - backend-uploads:/app/uploads
    depends_on:
      - postgres

  customer:
    build:
      context: ./customer
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 4173
    working_dir: /app
    environment:
      VITE_API_BASE_URL: "http://localhost:5001/api"
      VITE_SOCKET_URL: "http://localhost:5001"
    ports:
      - "5173:4173"
    volumes:
      - ./customer/src:/app/src
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5174
    working_dir: /app
    environment:
      VITE_API_BASE_URL: "http://localhost:5001/api"
    ports:
      - "5174:5174"
    volumes:
      - ./admin/src:/app/src
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-uploads:
